<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>

    <!-- Vibrant Cyan to Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Energy Lightning / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Global Longitude / Latitude Rings (World Grid) -->
  <g opacity="0.22" stroke="#38bdf8" stroke-width="2.5" fill="none">
    <circle cx="256" cy="256" r="170"/>
    <ellipse cx="256" cy="256" rx="170" ry="80"/>
    <ellipse cx="256" cy="256" rx="80" ry="170"/>
    <line x1="86" y1="256" x2="426" y2="256"/>
    <line x1="256" y1="86" x2="256" y2="426"/>
  </g>

  <!-- Outer Pulse Wave 1 -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Modern Hexagon Shield Background -->
  <path d="M 256 120 L 370 185 L 370 315 L 256 380 L 142 315 L 142 185 Z" 
        fill="rgba(15, 33, 64, 0.75)" 
        stroke="url(#primaryGrad)" 
        stroke-width="5" 
        filter="url(#subtleGlow)"/>

  <!-- Telecom Signal Waves Left & Right -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Left Waves -->
    <path d="M 195 230 A 38 38 0 0 0 195 282"/>
    <path d="M 180 215 A 58 58 0 0 0 180 297"/>
    <!-- Right Waves -->
    <path d="M 317 230 A 38 38 0 0 1 317 282"/>
    <path d="M 332 215 A 58 58 0 0 1 332 297"/>
  </g>

  <!-- Central Dynamic Lightning & Arrow Bolt (Instant Recharge & Mobile Delivery) -->
  <path d="M 272 155 L 210 270 L 252 270 L 236 355 L 312 242 L 268 242 Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)"/>

  <!-- Satellite / Connection Nodes -->
  <circle cx="256" cy="120" r="8" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="370" cy="185" r="7" fill="#38bdf8"/>
  <circle cx="370" cy="315" r="7" fill="#34d399" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="8" fill="#38bdf8"/>
  <circle cx="142" cy="315" r="7" fill="#34d399" filter="url(#glow)"/>
  <circle cx="142" cy="185" r="7" fill="#38bdf8"/>

  <!-- Center Pulse Dot -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#glow)"/>
</svg>
