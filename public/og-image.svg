<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224"/>
      <stop offset="50%" stop-color="#0b1b36"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Decorative Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Radial Glow Behind Logo -->
  <circle cx="210" cy="315" r="180" fill="#2563eb" opacity="0.22" filter="url(#ogGlow)"/>

  <!-- App Icon on Left -->
  <g transform="translate(110, 215) scale(0.4)">
    <rect width="512" height="512" rx="128" fill="#0d2342" stroke="#38bdf8" stroke-width="8"/>
    <g opacity="0.3" stroke="#38bdf8" stroke-width="4" fill="none">
      <circle cx="256" cy="256" r="170"/>
      <ellipse cx="256" cy="256" rx="170" ry="80"/>
      <ellipse cx="256" cy="256" rx="80" ry="170"/>
    </g>
    <path d="M 272 140 L 195 275 L 250 275 L 230 380 L 325 245 L 270 245 Z" fill="#10b981"/>
  </g>

  <!-- Brand Typography -->
  <text x="360" y="240" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Recarga<tspan fill="#38bdf8">Mundial</tspan>
  </text>

  <rect x="360" y="270" width="310" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="378" cy="287" r="5" fill="#10b981"/>
  <text x="394" y="293" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="14" font-weight="800" fill="#34d399" letter-spacing="1">
    ENLACE REAL &amp; DESPACHO INMEDIATO
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="360" y="360" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="28" font-weight="600" fill="#cbd5e1">
    Recargas móviles internacionales a más de 140 países
  </text>
  <text x="360" y="405" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="20" font-weight="400" fill="#94a3b8">
    Claro · Altice · T-Mobile · AT&amp;T · Movistar · Telcel · Viva · Digicel · Orange
  </text>

  <!-- Feature Pills -->
  <g transform="translate(360, 445)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="29" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="15" font-weight="700" fill="#ffffff">✓ Pagos Reales PayPal</text>
    
    <!-- Pill 2 -->
    <rect x="235" y="0" width="240" height="46" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="255" y="29" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="15" font-weight="700" fill="#ffffff">✓ Red Reloadly Airtime</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="210" height="46" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="510" y="29" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="15" font-weight="700" fill="#38bdf8">✓ Cero Estafas / 100% Real</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#ogAccent)"/>
</svg>
